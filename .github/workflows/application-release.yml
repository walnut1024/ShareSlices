name: Build application release

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: Immutable OCI repository prefix for deployment role images
        required: true
        type: string
      platforms:
        description: Comma-separated Kubernetes image platforms
        required: true
        default: linux/amd64
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build immutable release inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: jdx/mise-action@v3
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          version: "0.11.16"
      - uses: docker/setup-buildx-action@v3
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Install locked dependencies
        run: mise run install -- --frozen-lockfile
      - name: Verify source
        run: mise run check
      - name: Build environment-neutral Web assets
        run: >-
          mise run build-static-assets --
          --output dist/static-assets
          --manifest-output dist/manifests/static-assets.json
      - name: Build Cloudflare Worker bundles
        run: mise run cloudflare-build-workers -- --output dist/cloudflare-workers
      - name: Resolve OCI registry
        id: registry
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          case "$IMAGE_REPOSITORY" in
            *://*|""|*' '*|*'/'*) ;;
            *) exit 1 ;;
          esac
          printf 'host=%s\n' "${IMAGE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
      - name: Authenticate OCI publication
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.OCI_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.OCI_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish Kubernetes role images
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_PLATFORMS: ${{ inputs.platforms }}
        run: >-
          mise run kubernetes-build-images --
          --repository "$IMAGE_REPOSITORY"
          --source-revision "$GITHUB_SHA"
          --source-repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --platforms "$IMAGE_PLATFORMS"
          --output dist/kubernetes-images
      - name: Publish Cloudflare Container role images
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_PLATFORMS: ${{ inputs.platforms }}
        run: >-
          mise run cloudflare-build-container-images --
          --repository "$IMAGE_REPOSITORY"
          --source-revision "$GITHUB_SHA"
          --source-repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --platforms "$IMAGE_PLATFORMS"
          --output dist/cloudflare-container-images
      - name: Retain release inputs
        uses: actions/upload-artifact@v4
        with:
          name: shareslices-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
