      ports:
        - {protocol: TCP, port: 7456}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shareslices-dns-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: replace-by-renderer}
          podSelector:
            matchLabels: {shareslices.dev/dns: replace-by-renderer}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
