apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shareslices-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shareslices-web-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: shareslices-web}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: replace-by-renderer}
          podSelector:
            matchLabels: {shareslices.dev/ingress-controller: replace-by-renderer}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shareslices-content-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: shareslices-content}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: replace-by-renderer}
          podSelector:
            matchLabels: {shareslices.dev/ingress-controller: replace-by-renderer}
      ports:
        - {protocol: TCP, port: 7460}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shareslices-api-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: shareslices-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: shareslices-web}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: shareslices-worker}
      ports:
        - {protocol: TCP, port: 7456}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shareslices-web-api-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: shareslices-web}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: shareslices-api}
      ports:
        - {protocol: TCP, port: 7456}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
