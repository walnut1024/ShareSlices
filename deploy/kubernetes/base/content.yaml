apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareslices-content
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shareslices-content
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shareslices-content
    spec:
      serviceAccountName: shareslices-content
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: content
          image: shareslices-content@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          command: ["node", "dist/src/content/main.js"]
          env:
            - name: GALLERY_CONTENT_PORT
              valueFrom: {configMapKeyRef: {name: shareslices-config, key: GALLERY_CONTENT_PORT}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: shareslices-content-secrets, key: DATABASE_URL}}
            - name: S3_ENDPOINT
              valueFrom: {configMapKeyRef: {name: shareslices-config, key: S3_ENDPOINT}}
            - name: S3_REGION
              valueFrom: {configMapKeyRef: {name: shareslices-config, key: S3_REGION}}
            - name: S3_BUCKET
              valueFrom: {configMapKeyRef: {name: shareslices-config, key: S3_BUCKET}}
            - name: S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: shareslices-content-secrets, key: S3_ACCESS_KEY_ID}}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: shareslices-content-secrets, key: S3_SECRET_ACCESS_KEY}}
          ports:
            - {name: http, containerPort: 7460}
          readinessProbe: {httpGet: {path: /ready, port: http}}
          livenessProbe: {httpGet: {path: /health, port: http}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shareslices-content
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shareslices-content
  ports:
    - {name: http, port: 7460, targetPort: http}
