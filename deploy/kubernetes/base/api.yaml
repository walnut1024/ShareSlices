apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareslices-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shareslices-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shareslices-api
    spec:
      serviceAccountName: shareslices-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: shareslices-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          envFrom:
            - configMapRef:
                name: shareslices-config
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: shareslices-api-secrets, key: DATABASE_URL}}}
            - {name: BETTER_AUTH_SECRET, valueFrom: {secretKeyRef: {name: shareslices-api-secrets, key: BETTER_AUTH_SECRET}}}
            - {name: AUTH_EMAIL_ENCRYPTION_KEY, valueFrom: {secretKeyRef: {name: shareslices-api-secrets, key: AUTH_EMAIL_ENCRYPTION_KEY}}}
            - {name: CONTENT_FINGERPRINT_KEY_CURRENT, valueFrom: {secretKeyRef: {name: shareslices-api-secrets, key: CONTENT_FINGERPRINT_KEY_CURRENT}}}
            - {name: CONTENT_FINGERPRINT_KEY_PREVIOUS, valueFrom: {secretKeyRef: {name: shareslices-api-secrets, key: CONTENT_FINGERPRINT_KEY_PREVIOUS, optional: true}}}
            - {name: IDEMPOTENCY_ENCRYPTION_KEY_CURRENT, valueFrom: {secretKeyRef: {name: shareslices-api-secrets, key: IDEMPOTENCY_ENCRYPTION_KEY_CURRENT}}}
            - {name: IDEMPOTENCY_ENCRYPTION_KEY_PREVIOUS, valueFrom: {secretKeyRef: {name: shareslices-api-secrets, key: IDEMPOTENCY_ENCRYPTION_KEY_PREVIOUS, optional: true}}}
            - {name: GALLERY_TURNSTILE_SECRET, valueFrom: {secretKeyRef: {name: shareslices-api-secrets, key: GALLERY_TURNSTILE_SECRET, optional: true}}}
            - {name: S3_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: shareslices-api-secrets, key: S3_ACCESS_KEY_ID}}}
            - {name: S3_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: shareslices-api-secrets, key: S3_SECRET_ACCESS_KEY}}}
          ports:
            - name: http
              containerPort: 7456
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shareslices-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shareslices-api
  ports:
    - name: http
      port: 7456
      targetPort: http
