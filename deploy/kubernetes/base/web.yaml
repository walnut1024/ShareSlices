apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareslices-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shareslices-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shareslices-web
    spec:
      serviceAccountName: shareslices-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: shareslices-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          env:
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: shareslices-config
                  key: API_UPSTREAM
            - name: PUBLIC_API_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: shareslices-config
                  key: PUBLIC_API_ORIGIN
            - name: PUBLIC_VIEWER_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: shareslices-config
                  key: PUBLIC_VIEWER_ORIGIN
            - name: PUBLIC_GALLERY_CONTENT_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: shareslices-config
                  key: PUBLIC_GALLERY_CONTENT_ORIGIN
            - name: PUBLIC_GALLERY_TURNSTILE_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: shareslices-config
                  key: PUBLIC_GALLERY_TURNSTILE_SITE_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /web-health
              port: http
          livenessProbe:
            httpGet:
              path: /web-health
              port: http
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
      volumes:
        - name: caddy-config
          configMap:
            name: shareslices-config
            items:
              - key: Caddyfile
                path: Caddyfile
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shareslices-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shareslices-web
  ports:
    - name: http
      port: 8080
      targetPort: http
