apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareslices-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shareslices-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shareslices-worker
    spec:
      serviceAccountName: shareslices-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: shareslices-processing@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: shareslices-config
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: shareslices-worker-secrets, key: DATABASE_URL}}}
            - {name: S3_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: shareslices-worker-secrets, key: S3_ACCESS_KEY_ID}}}
            - {name: S3_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: shareslices-worker-secrets, key: S3_SECRET_ACCESS_KEY}}}
            - {name: CONTENT_FINGERPRINT_KEY_CURRENT, valueFrom: {secretKeyRef: {name: shareslices-worker-secrets, key: CONTENT_FINGERPRINT_KEY_CURRENT}}}
            - {name: CONTENT_FINGERPRINT_KEY_PREVIOUS, valueFrom: {secretKeyRef: {name: shareslices-worker-secrets, key: CONTENT_FINGERPRINT_KEY_PREVIOUS, optional: true}}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: worker-tmp
              mountPath: /tmp/shareslices
          startupProbe:
            exec:
              command: ["shareslices-worker", "healthcheck"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["shareslices-worker", "healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["shareslices-worker", "healthcheck"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: worker-tmp
          emptyDir:
            sizeLimit: 2Gi
