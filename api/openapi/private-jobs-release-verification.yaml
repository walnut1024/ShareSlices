openapi: 3.1.0
info:
  title: ShareSlices private Jobs release verification
  version: 1.0.0
  description: Route-free protocol callable only through the release verifier Worker's explicit fetch Service Binding.
servers:
  - url: http://shareslices-jobs.internal
paths:
  /v1/release-verification:
    post:
      operationId: verifyJobsRelease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Probe"
      responses:
        "200":
          description: Fenced private evidence from the executing Jobs Worker.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            X-ShareSlices-Evidence-Digest:
              schema:
                type: string
                pattern: "^sha256:[0-9a-f]{64}$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "404":
          description: Invalid, unscoped, expired, terminal, or stale-fence probe.
  /v1/release-verification/finalize:
    post:
      operationId: finalizeJobsReleaseVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeProbe"
      responses:
        "200":
          description: The evidence nonce is terminal and cleanup is quiescing.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        "404":
          description: Invalid, mismatched, or stale evidence finalization.
  /v1/release-verification/cleanup:
    post:
      operationId: cleanupJobsReleaseVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupProbe"
      responses:
        "200":
          description: Idempotent final inventory proves owned synthetic state removed.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        "409":
          description: An isolated nonce-owned orphan remains after quiescence.
        "404":
          description: Invalid scope, non-terminal nonce, or quiescence not reached.
components:
  schemas:
    Probe:
      type: object
      additionalProperties: false
      required: [version, invocationId, nonce, releaseId, fence, subFence]
      properties:
        version: {type: integer, const: 1}
        invocationId: {type: string, minLength: 16, maxLength: 256}
        nonce: {type: string, minLength: 16, maxLength: 256}
        releaseId: {type: string, minLength: 1, maxLength: 256}
        fence: {type: integer, minimum: 1}
        subFence: {type: integer, minimum: 1}
    FinalizeProbe:
      type: object
      additionalProperties: false
      required:
        - version
        - invocationId
        - nonce
        - releaseId
        - fence
        - subFence
        - evidenceDigest
        - tombstoneSeconds
        - quiescenceSeconds
      properties:
        version: {type: integer, const: 1}
        invocationId: {type: string, minLength: 16, maxLength: 256}
        nonce: {type: string, minLength: 16, maxLength: 256}
        releaseId: {type: string, minLength: 1, maxLength: 256}
        fence: {type: integer, minimum: 1}
        subFence: {type: integer, minimum: 1}
        evidenceDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        tombstoneSeconds: {type: integer, minimum: 1}
        quiescenceSeconds: {type: integer, minimum: 1}
    CleanupProbe:
      type: object
      additionalProperties: false
      required: [version, nonce, releaseId, fence]
      properties:
        version: {type: integer, const: 1}
        nonce: {type: string, minLength: 16, maxLength: 256}
        releaseId: {type: string, minLength: 1, maxLength: 256}
        fence: {type: integer, minimum: 1}
    Evidence:
      type: object
      additionalProperties: false
      required:
        - version
        - scope
        - jobsWorker
        - migrationHead
        - database
        - broker
        - synthetic
        - configuredContainerImages
        - containers
        - containerConvergence
      properties:
        version: {type: integer, const: 1}
        scope:
          type: object
          additionalProperties: false
          required: [nonce, releaseId, fence, subFence]
          properties:
            nonce: {type: string}
            releaseId: {type: string}
            fence: {type: integer, minimum: 1}
            subFence: {type: integer, minimum: 1}
        jobsWorker:
          type: object
          additionalProperties: false
          required:
            - versionId
            - versionTimestamp
            - releaseBundleIdentity
            - configurationDigest
            - exportsDigest
          properties:
            versionId: {type: string, minLength: 1}
            versionTag: {type: string, minLength: 1}
            versionTimestamp: {type: string, format: date-time}
            releaseBundleIdentity: {type: string, minLength: 1}
            configurationDigest:
              type: string
              pattern: "^sha256:[0-9a-f]{64}$"
            exportsDigest:
              type: string
              pattern: "^sha256:[0-9a-f]{64}$"
        migrationHead: {type: string, minLength: 1}
        database:
          type: object
          additionalProperties: false
          required: [mode, reachable]
          properties:
            mode: {type: string, const: hyperdrive}
            reachable: {type: boolean, const: true}
        broker:
          type: object
          additionalProperties: false
          required: [origin, publicIngress]
          properties:
            origin:
              type: string
              const: http://shareslices-broker.internal
            publicIngress: {type: boolean, const: false}
        synthetic:
          type: object
          additionalProperties: false
          required: [namespace, database, broker, r2]
          properties:
            namespace:
              type: string
              pattern: "^release-verification/[A-Za-z0-9_-]{16,256}/$"
            database:
              $ref: "#/components/schemas/SyntheticCommit"
            broker:
              $ref: "#/components/schemas/SyntheticCommit"
            r2:
              type: object
              additionalProperties: false
              required:
                - resourceKey
                - bytes
                - contentDigest
                - roundTrip
              properties:
                resourceKey: {type: string, minLength: 1}
                bytes: {type: integer, minimum: 1}
                contentDigest:
                  type: string
                  pattern: "^sha256:[0-9a-f]{64}$"
                roundTrip: {type: boolean, const: true}
        configuredContainerImages:
          type: object
          additionalProperties: false
          required: [trustedProcessing, thumbnail]
          properties:
            trustedProcessing: {type: string, minLength: 1}
            thumbnail: {type: string, minLength: 1}
        containers:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
              - nonce
              - releaseId
              - fence
              - subFence
              - containerClass
              - stableSlot
              - providerInstance
              - controllerInstance
              - buildIdentity
              - contractRevision
              - imageReference
              - observedAt
            properties:
              nonce: {type: string, minLength: 16, maxLength: 256}
              releaseId: {type: string, minLength: 1, maxLength: 256}
              fence: {type: integer, minimum: 1}
              subFence: {type: integer, minimum: 1}
              containerClass:
                type: string
                enum: [trusted-processing, thumbnail]
              stableSlot:
                type: string
                pattern: "^[a-z0-9][a-z0-9-]{0,127}$"
              providerInstance: {type: string, minLength: 1, maxLength: 256}
              controllerInstance: {type: string, minLength: 1, maxLength: 256}
              buildIdentity: {type: string, minLength: 1, maxLength: 512}
              contractRevision: {type: string, minLength: 1, maxLength: 256}
              imageReference: {type: string, minLength: 1, maxLength: 512}
              observedAt: {type: string, format: date-time}
        containerConvergence:
          type: string
          const: verified
    SyntheticCommit:
      type: object
      additionalProperties: false
      required: [resourceKey, committed]
      properties:
        resourceKey: {type: string, minLength: 1}
        committed: {type: boolean, const: true}
